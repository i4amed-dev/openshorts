name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests only touch light modules (subtitles/hooks/translate/edit_builder,
      # the cloud metering helpers, and the Telegram bot), so we install just
      # what they import instead of the full requirements.txt (faster-whisper/
      # ultralytics/mediapipe are too heavy for CI). sqlalchemy is needed
      # because tests/test_metering_free_plan.py imports cloud.metering;
      # python-telegram-bot is needed for tests/test_telegram_*.py — it's a
      # pure-Python asyncio client, not a heavy ML dependency, so it's cheap
      # enough for CI unlike the excluded ones above.
      - name: Install test dependencies
        run: pip install pytest pillow httpx pydantic sqlalchemy "python-telegram-bot[job-queue,rate-limiter]==21.11.1"
      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
