services:
  backend:
    build: .
    container_name: klippo-backend
    ports:
      # Host 8001, container 8000. Only the host side moved: the frontend and
      # renderer reach the API as http://backend:8000 over the compose network
      # (dashboard/vite.config.js), so nothing in the app depends on which host
      # port this is. 8000 is left free for whatever else is using it locally.
      - "8001:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
      # Autopilot's SQLite state. A named volume, NOT a path inside the image:
      # the container filesystem is discarded on every rebuild, and losing this
      # file means losing which sources were processed and which posts were
      # already sent — i.e. duplicate processing and duplicate publishing after
      # an update. Backed up by copying output/autopilot/autopilot.db*.
      - autopilot-state:/app/output/autopilot
    # Load .env into the container environment. Without this the keys reach only
    # code that calls load_dotenv() AND only because the repo is bind-mounted —
    # so an image-only deployment (no bind mount) would silently have no
    # credentials, since .dockerignore correctly keeps .env out of the image.
    # `required: false` so the stack still starts before you have written one.
    env_file:
      - path: .env
        required: false
    environment:
      # One heavy pipeline at a time. Whisper + YOLO/MediaPipe + FFmpeg on an
      # M1 will happily consume every core and all the RAM; running two jobs
      # concurrently is how the machine locks up rather than how it goes faster.
      # Autopilot enforces its own single-pipeline rule on top of this.
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - AUTOPILOT_ENABLED=${AUTOPILOT_ENABLED:-1}
      - AUTOPILOT_DB_PATH=/app/output/autopilot/autopilot.db
    restart: unless-stopped
    healthcheck:
      # Hits the detailed probe so an Autopilot database that will not open is
      # visible as a degraded container, not just as a quiet feature outage.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/detail', timeout=5)); sys.exit(0 if d.get('status')=='ok' else 1)\""]
      interval: 60s
      timeout: 15s
      # Model loading and the first yt-dlp warm-up make early boot slow; a short
      # start_period would mark a perfectly healthy container as failed.
      start_period: 180s
      retries: 3

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: klippo-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: klippo-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  autopilot-state:
