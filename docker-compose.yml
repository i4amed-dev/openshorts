services:
  backend:
    build: .
    container_name: klippo-backend
    ports:
      # Host 8001, container 8000. Only the host side moved: the frontend and
      # renderer reach the API as http://backend:8000 over the compose network
      # (dashboard/vite.config.js), so nothing in the app depends on which host
      # port this is. 8000 is left free for whatever else is using it locally.
      - "8001:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: klippo-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: klippo-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
